name: Byg usigneret IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.2.0']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vaelg Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Byg
        run: ./build-ipa.sh

      - name: Byg development client
        run: ./build-devclient.sh

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mo-madhakka-ipa-xcode-${{ matrix.xcode }}
          path: build/app.ipa
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mo-madhakka-devclient
          path: build/dev.ipa
          retention-days: 30
          if-no-files-found: error
