name: Byg usigneret IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vaelg nyeste Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then latest=/Applications/Xcode.app; fi
          echo "Bruger $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Byg
        run: ./build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Dagligt-ipa
          path: build/Dagligt.ipa
          retention-days: 30
          if-no-files-found: error
